<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CODE RUNNER - Escape the Virus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🎮 CODE RUNNER</h1>
        <p class="subtitle">ESCAPE THE VIRUS</p>

        <div class="game-info">
            <span>🏆 Score: <b id="score">0</b></span>
            <span>📏 Distance: <b id="distance">0</b> m</span>
            <span>❤️ Lives: <b id="lives">3</b></span>
        </div>

        <canvas id="gameCanvas" width="900" height="500"></canvas>

        <div class="controls">
            ⬅️ Left &nbsp;&nbsp;
            ⬆️ Jump &nbsp;&nbsp;
            ⬇️ Slide &nbsp;&nbsp;
            ➡️ Right
        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
